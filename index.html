function lootRoll(zone,elite=false,boss=false){const a=Math.random(),rarity=boss?(a<.18?3:2):elite?(a<.09?3:a<.52?2:1):(a<.015?3:a<.11?2:a<.48?1:0);let types=['weapon','armor','charm'],type=types[Math.floor(Math.random()*3)],tier=1+zone+(save.zoneTier[zone]||0),power=Math.round((3+tier*3)*RARITIES[rarity].scale);return {id:'drop_'+(++save.lootCounter),name:LOOT_NAMES[type][Math.floor(Math.random()*3)],type,rarity,tier,power,bonus:type==='weapon'?{might:power/100}:type==='armor'?{hp:power*3,armor:Math.max(1,Math.round(power/9))}:{growth:power/100,magnet:power*2}};}

function point(e){const rc=cvs.getBoundingClientRect();return{x:e.clientX-rc.left,y:e.clientY-rc.top};}
cvs.addEventListener('pointerdown',e=>{if(phase!=='run')return;let p=point(e);if(p.x>W*.48)return;joy.id=e.pointerId;joy.x=p.x;joy.y=p.y;joy.dx=0;joy.dy=0;try{cvs.setPointerCapture(e.pointerId)}catch(_){};let pd=$('pad');pd.style.left=(p.x-55)+'px';pd.style.top=(p.y-55)+'px';pd.style.bottom='auto';pd.style.width='110px';pd.style.height='110px';});cvs.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let p=point(e),x=p.x-joy.x,y=p.y-joy.y,m=Math.max(1,Math.hypot(x,y));joy.dx=x/m*Math.min(1,m/42);joy.dy=y/m*Math.min(1,m/42);$('nub').style.transform=`translate(calc(-50% + ${joy.dx*35}px),calc(-50% + ${joy.dy*35}px))`;});function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.dx=joy.dy=0;$('nub').style.transform='translate(-50%,-50%)';}$('pad').addEventListener('pointerup',joyEnd);cvs.addEventListener('pointerup',joyEnd);cvs.addEventListener('pointercancel',joyEnd);
window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key==='Escape'||e.key==='p'){if(phase==='run')pause();else if(phase==='pause')$('resume').click();}if(e.key===' ')useSkill();});window.addEventListener('keyup',e=>keys.delete(e.key));document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='run')pause();});window.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('pagehide',persist);menu();
})();
window.addEventListener('error',function(e){let el=document.getElementById('screen');if(el&&el.style.display!=='none'){let x=document.getElementById('startupError');if(!x){x=document.createElement('p');x.id='startupError';x.style.cssText='color:#ffb9a3;font:12px system-ui;max-width:80vw;overflow-wrap:anywhere';el.appendChild(x);}x.textContent='Грешка при зареждане: '+(e.message||'Неизвестна');}});
</script></body></html>
