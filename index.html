@font-face{font-family:HellboundUI;src:url('./assets/fonts/ui.woff2') format('woff2');font-display:swap;font-weight:100 900}

function updateUnlocksV1(){let fresh=false;const add=(a,v)=>{if(!a.includes(v)){a.push(v);fresh=true;}};if(save.maxLevel>=15)add(save.unlockedHeroes,2);if(save.kills>=1000)add(save.unlockedHeroes,3);if(save.wins[0]){add(save.unlockedHeroes,4);add(save.unlockedStages,1);}if(save.wins[1])add(save.unlockedStages,2);for(let i=0;i<ACHIEVEMENTS.length;i++){const a=ACHIEVEMENTS[i],v=a.metric.startsWith('win')?save.wins[Number(a.metric.slice(-1))]:save[a.metric];if(v>=a.goal)add(save.achievements,i);}return fresh;}

 return `<${index===null?'div':'button'} class="card" ${index===null?'':`data-action="choice${index}"`} style="border-left:3px solid ${color};${choices.length===4?'min-height:108px;margin:7px 0;padding:12px':''}"><img alt="" src="${imageURL(icon)}"><span><h3 style="color:${color}">${name}</h3><p>${desc}</p>${flavor?`<p class="flavor">${flavor}</p>`:''}<p class="rarity" style="color:${color}">${rarity}</p></span></${index===null?'div':'button'}>`;}

function uiActionV1(action){Sound.unlock();Sound.play('ui');if(action.startsWith('choice'))return chooseUpgrade(Number(action.slice(6)));if(action.startsWith('buy_')){const m=META.find(x=>x.id===action.slice(4));if(m&&metaLv(m.id)<m.max&&save.gold>=metaCost(m)){save.economy.spent+=metaCost(m);save.gold-=metaCost(m);save.meta[m.id]=metaLv(m.id)+1;persist();cryptScreen();Sound.play('coin');}return;}if(/^stage[0-2]$/.test(action)){const n=Number(action.slice(-1));if(save.unlockedStages.includes(n)){selectedStage=n;stageScreen();}return;}
 switch(action){case 'begin':unlockDevice();menu();break;case 'menu':menu();break;case 'play':case 'heroes':heroScreen();break;case 'heroPrev':selectedHero=(selectedHero+5)%6;heroScreen();break;case 'heroNext':selectedHero=(selectedHero+1)%6;heroScreen();break;case 'stage':if(save.unlockedHeroes.includes(selectedHero))stageScreen();break;case 'start':if(save.unlockedHeroes.includes(selectedHero)&&save.unlockedStages.includes(selectedStage)){unlockDevice();startRun();}break;case 'crypt':cryptScreen();break;case 'achievements':achievementScreen();break;case 'settings':settingsScreen();break;case 'settingsPause':settingsScreen('pause');break;case 'pause':showPause();break;case 'resume':resumeRun();break;case 'quit':showUI(`<h2>${T('quit')}</h2><p class="subtitle">${T('quitConfirm')}</p><div class="stack">${button(T('confirm'),'confirmQuit','primary')}${button(T('cancel'),'pause')}</div>`,'quit');break;case 'confirmQuit':finishRun(false);break;case 'reroll':if(run.rerolls>0){run.rerolls--;choices=rollChoices();banishMode=false;renderLevelup();}break;case 'banish':if(run.banishes>0){banishMode=!banishMode;renderLevelup();}break;case 'closeChest':resumeRun();break;case 'export':{const a=document.getElementById('saveText');a.value=JSON.stringify(save);a.focus({preventScroll:true});a.select();toast(T('copied'));break;}case 'import':{try{const a=document.getElementById('saveText'),s=normalizeSave(JSON.parse(a.value));save=s;persist();updateUnlocks();settingsScreen(settingsReturn);Sound.volumes();toast(T('imported'));}catch(_){toast(T('invalid'));}break;}case 'fullscreen':unlockDevice();break;}}
/* ==================== INPUT / LIFECYCLE ==================== */
const Input={x:0,y:0,ox:0,oy:0,pointer:null,keys:{},lastRight:-10,reset(){this.x=0;this.y=0;this.pointer=null;this.keys={};}};

function scrollKey(el){return el?.dataset?.id||el?.dataset?.action||(el?.dataset?.setting?'setting:'+el.dataset.setting:null)||(el?.dataset?.inventory?'inventory:'+el.dataset.inventory:null)||el?.id||null;}
function scrollElements(container){return Array.from(container?.querySelectorAll?.('[data-id], [data-action], [data-setting], [data-inventory], [id]')||[]);}
function captureScroll(container){
 if(!container)return null;
 const top=container.getBoundingClientRect().top,anchors=[];
 for(const el of scrollElements(container)){if(el.closest?.('.v8-tabs,.v8-wallet'))continue;const rect=el.getBoundingClientRect(),id=scrollKey(el);if(id&&rect.bottom>top&&rect.height>0)anchors.push({id,offset:rect.top-top});}
 return {top:container.scrollTop||0,anchors,focus:container.contains?.(document.activeElement)?scrollKey(document.activeElement):null};
}
function restoreScroll(container,snapshot){
 if(!container||!snapshot)return;
 const elements=scrollElements(container),byId=new Map();
 for(const el of elements){const id=scrollKey(el);if(!byId.has(id))byId.set(id,el);}
 container.scrollTop=snapshot.top;
 for(const anchor of snapshot.anchors){const el=byId.get(anchor.id);if(!el)continue;
  container.scrollTop+=el.getBoundingClientRect().top-container.getBoundingClientRect().top-anchor.offset;break;
 }
 const focused=byId.get(snapshot.focus);if(focused&&!focused.disabled)focused.focus({preventScroll:true});
}
function withScrollPreserved(container,renderFn){
 const snapshot=captureScroll(container),result=renderFn();restoreScroll(result||container,snapshot);return result;
}

 if(action.startsWith('testact-')){const id=Number(action.slice(8));if(Number.isInteger(id)&&id>=0&&id<4){campaignAct=id;testScreen();}return;}
 if(action==='enter'||action==='start'){sandboxMode=false;sandboxBoss=false;unlockDevice();const cp=save.campaign.checkpoint;startRun(cp?.stage===selectedStage&&cp.hero===selectedHero?cp:null);return;}

 if(action.startsWith('unwear-')){const slot=action.slice(7);if(SLOT_RULES[slot]){save.worn[slot]=null;persist();gearScreen();}return;}
