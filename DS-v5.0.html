}
function updateHUD(){if(!run)return;const hp=clamp(run.hp/maxHp(),0,1),h=HEROES[run.hero];$('hpfill').style.width=hp*100+'%';$('xpfill').style.width=clamp(run.xp/run.xpNeed,0,1)*100+'%';$('level').textContent=' · '+run.level+' ниво';$('statline').textContent=`${Math.ceil(run.hp)}/${maxHp()} HP · ${run.kills} ⚔ · ${run.gold} ●`;$('timer').innerHTML=`${fmt(run.time)}<small>${ZONES[run.zone].short}</small>`;$('orb').textContent=Math.ceil(run.hp);$('orb').style.background=`radial-gradient(circle at 35% 25%,#f4a78e70,transparent 35%),linear-gradient(0deg,#98262e ${hp*100}%,#141923 ${hp*100}%)`;$('skill').disabled=run.skill>0;$('skill').querySelector('span').textContent=run.skill>0?Math.ceil(run.skill)+' сек':h.skill;$('dash').disabled=run.dash>0;$('dash').querySelector('span').textContent=run.dash>0?Math.ceil(run.dash)+' сек':'Бягство';if(run.boss?.active){$('bossbar').style.display='block';$('bossname').textContent=ZONES[run.zone].boss;$('bossfill').style.width=clamp(run.boss.hp/run.boss.maxHp,0,1)*100+'%';}else $('bossbar').style.display='none';}
function frame(now){const raw=last?(now-last)/1000:0;last=now;const dt=Math.min(.05,raw);bgTime+=dt;if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').style.display='none';}if(phase==='run'){frameAvg=frameAvg*.98+raw*1000*.02;if(run.time>3&&frameAvg>24&&save.settings.quality==='auto')autoLow=true;acc=Math.min(.05,acc+dt);let steps=0;while(acc>=1/60&&steps++<3&&phase==='run'){update(1/60);acc-=1/60;}}else acc=0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0b1318';ctx.fillRect(0,0,W,H);if(run&&['run','pause','levelup'].includes(phase))drawWorld();else drawTown();uiTime+=dt;if(uiTime>.1){if(run&&['run','pause','levelup'].includes(phase))updateHUD();uiTime=0;}requestAnimationFrame(frame);}
// EVENTS / MOBILE LIFECYCLE --------------------------------------------------
function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.addEventListener('pointerdown',e=>{if(phase!=='run'||joy.id!==null)return;const p=point(e);if(p.x>W*.52)return;unlockAudio();joy.id=e.pointerId;joy.x=p.x;joy.y=p.y;joy.dx=joy.dy=0;try{canvas.setPointerCapture(e.pointerId);}catch(_){}const pad=$('pad');pad.style.left=p.x-pad.offsetWidth/2+'px';pad.style.top=p.y-pad.offsetHeight/2+'px';pad.style.bottom='auto';});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id||phase!=='run')return;const p=point(e),x=p.x-joy.x,y=p.y-joy.y,n=Math.hypot(x,y),amp=n<5?0:Math.min(1,(n-5)/37);joy.dx=n?x/n*amp:0;joy.dy=n?y/n*amp:0;$('nub').style.transform=`translate(calc(-50% + ${joy.dx*29}px),calc(-50% + ${joy.dy*29}px))`;});
function release(e){if(e.pointerId===joy.id)resetInput();}
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,release);
for(const [id,fn]of [['skill',useSkill],['dash',dash]]){$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});$(id).addEventListener('click',e=>{if(e.detail===0)fn();});}
$('pauseBtn').onclick=()=>pause();
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='escape'||k==='p'){if(phase==='run')pause();else if(phase==='pause')$('resume')?.click();}if(k===' ')useSkill();if(k==='shift')dash();});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function suspend(){if(phase==='run')pause('Играта е спряна, докато си извън прозореца.');resetInput();checkpoint();try{audio.ctx?.suspend()?.catch(()=>{});}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();});window.addEventListener('blur',suspend);window.addEventListener('pagehide',()=>{checkpoint();persist();});window.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('popstate',()=>{if(phase==='run'){pause();try{history.pushState({hellbound:true},'');}catch(_){}}});try{history.pushState({hellbound:true},'');}catch(_){}
screen.addEventListener('pointerdown',unlockAudio,{passive:true});
// BOOT -----------------------------------------------------------------------
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
resize();for(let i=0;i<3;i++){sprite('hero'+i);sprite('prop'+i);floorTile(i);}for(let i=0;i<4;i++)sprite('enemy'+i);sprite('boss');sprite('bat');townArt();town();if(recovered)toast('Възстановен е наличният запис. Незавършеният рунд запазва ресурси до последния автоматичен запис.');requestAnimationFrame(frame);
})();
</script>
</body>
